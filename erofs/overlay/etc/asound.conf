# Software mixing on the console's codec, so several programs can play at once.
# The same layout the andr36oid broker writes for the game systems.
pcm.!default {
    type plug
    slave.pcm "dmixer"
}
pcm.dmixer {
    type dmix
    ipc_key 1024
    ipc_perm 0666
    slave { pcm "hw:0,0" period_time 0 period_size 1024 buffer_size 4096 rate 48000 }
    bindings { 0 0 1 1 }
}
ctl.!default { type hw card 0 }
